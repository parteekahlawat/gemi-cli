[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemi-cli"
version = "0.1.0"
description = "Free AI coding agent CLI — multi-account Gemini key rotation with provider failover"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Parteek", email = "pratham@a79.ai" },
]
keywords = ["ai", "coding-agent", "gemini", "cli", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "google-genai>=1.0",
    "openai>=1.0",
    "ollama>=0.4",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "prompt-toolkit>=3.0",
]

[project.urls]
Homepage = "https://github.com/parteekahlawat/gemi-cli"
Repository = "https://github.com/parteekahlawat/gemi-cli"
Issues = "https://github.com/parteekahlawat/gemi-cli/issues"

[project.scripts]
gemi = "gemi.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gemi"]

[tool.hatch.build.targets.sdist]
include = ["src/gemi"]
